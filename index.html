<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <!--box to display result-->
        <div class="result-display">0</div>
        <!--buttons-->
        <div class="buttons-container">
        <div class="one">
        <button class="clear">C</button>
        <button class="backspace">⌫</button>
        <button class="operator" data-action="/">÷</button>
        </div>
        <div class="two">
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator" data-action="+">+</button>
        </div>
        <div class="three">
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator" data-action="-">-</button>
        </div>
        <div class="four">
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator" data-action="*">×</button>
        </div>
        <div class="five">
        <button class="number">0</button>
        <button class="decimal">.</button>
        <button class="equal-to" data-action="=">=</button>
        </div>
        </div>
        <footer>
    <p>Powered by &copy; 2026 AyomideBlessing.</p>
</footer>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
